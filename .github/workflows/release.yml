name: Build macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Apple Silicon app
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app bundle
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./script/package_release.sh "${RELEASE_TAG#v}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobox-macOS-arm64
          path: dist/release/Mobox-macOS-arm64.zip
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Mobox ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/release/Mobox-macOS-arm64.zip
